[package]
name = "vardaclaw"
version = "0.1.0"
edition = "2021"
description = "VardaClaw: The VardaDB-backed AI Assistant (Fork of LocalGPT)."
license = "Apache-2.0"
repository = "https://github.com/varda-org/vardaclaw"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# HTTP client for VardaDB API
reqwest = { version = "0.12", features = ["json", "stream"] }

# Local embeddings (for query vector generation)
fastembed = "5.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
shellexpand = "3.1"
glob = "0.3"
regex = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
hmac = "0.12"
rand = "0.8"
async-stream = "0.3"
fs2 = "0.4"
json5 = "0.4"
toml = "0.8"
once_cell = "1.19"
base64 = "0.22"
rustyline = "14.0"
tempfile = "3.10"



# Note: Removed sqlite dependencies, axum, eframe to simplify for VardaDB client focus.
# If we need GUI later, we can add eframe back.

[lib]
path = "src/lib.rs"



[features]
default = []
gguf = []

