[package]
name = "runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "vardadb-runtime"
path = "src/main.rs"

[workspace]
members = [
    ".",
    "cli",
    "standalone",
    "workspace-hack",
    "crates/*",
    "crates/codederror/derive",
    "crates/core/derive",
    "crates/encoding/derive",
]
default-members = [
    ".",
    "cli",
    "standalone",
    "crates/admin-rest-model",
    "crates/base64-util",
    "crates/cli-util",
    "crates/clock",
    "crates/codederror",
    "crates/codederror/derive",
    "crates/core",
    "crates/core/derive",
    "crates/encoding",
    "crates/encoding/derive",
    "crates/errors",
    "crates/fs-util",
    "crates/futures-util",
    "crates/invoker-api",
    "crates/invoker-impl",
    "crates/memory",
    "crates/metadata-store",
    "crates/queue",
    "crates/serde-util",
    "crates/service-client",
    "crates/service-protocol",
    "crates/service-protocol-v4",
    "crates/sqlite-store",
    "crates/storage-api",
    "crates/test-util",
    "crates/time-util",
    "crates/tracing-instrumentation",
    "crates/types",
    "crates/utoipa",
    "crates/vqueues",
    "crates/worker",
]
resolver = "2"

[workspace.package]
version = "1.6.2"
authors = ["restate.dev"]
edition = "2024"
rust-version = "1.93.0"
license = "BUSL-1.1"
repository = "https://github.com/restatedev/restate"
homepage = "https://github.com/restatedev/restate"
description = "Restate makes distributed applications easy!"

[workspace.dependencies]
# Own crates
codederror = { path = "crates/codederror" }
restate-admin-rest-model = { path = "crates/admin-rest-model" }
restate-base64-util = { path = "crates/base64-util" }
restate-clock = { path = "crates/clock" }
restate-cli-util = { path = "crates/cli-util" }
restate-core = { path = "crates/core" }
restate-core-derive = { path = "crates/core/derive" }
restate-encoding = { path = "crates/encoding" }
restate-errors = { path = "crates/errors" }
restate-fs-util = { path = "crates/fs-util" }
restate-futures-util = { path = "crates/futures-util" }
restate-invoker-api = { path = "crates/invoker-api" }
restate-invoker-impl = { path = "crates/invoker-impl" }
restate-memory = { path = "crates/memory" }
restate-metadata-store = { path = "crates/metadata-store" }
restate-queue = { path = "crates/queue" }
restate-serde-util = { path = "crates/serde-util" }
restate-service-client = { path = "crates/service-client" }
restate-service-protocol = { path = "crates/service-protocol" }
restate-service-protocol-v4 = { path = "crates/service-protocol-v4" }
restate-sqlite-store = { path = "crates/sqlite-store" }
restate-storage-api = { path = "crates/storage-api" }
restate-test-util = { path = "crates/test-util" }
restate-time-util = { path = "crates/time-util" }
restate-tracing-instrumentation = { path = "crates/tracing-instrumentation" }
restate-types = { path = "crates/types" }
restate-utoipa = { path = "crates/utoipa" }
restate-vqueues = { path = "crates/vqueues" }
restate-worker = { path = "crates/worker" }

# this workspace-hack package is overridden by a patch below to use workspace-hack subdir when building in this repo
# outside this repo, the crates.io restate-workspace-hack (an empty package) will be used instead
restate-workspace-hack = "0.0.1"

# External crates
ahash = "0.8.12"
anyhow = "1.0.100"
arc-swap = "1.8"
arrow = { version = "57.1.0", default-features = false }
assert2 = "0.3.16"
async-channel = "2.5.0"
async-trait = "0.1.89"
axum = { version = "0.8.8", default-features = false }
aws-config = "1.8.12"
aws-sdk-dynamodb = "1.101.0"
aws-credential-types = "1.2.11"
aws-smithy-async = { version = "1.2.7", default-features = false }
aws-smithy-runtime-api = "1.9.3"
aws-smithy-types = "1.3.5"
base64 = "0.22"
bilrost = { version = "0.1014" }
bincode = { version = "2.0.1", default-features = false }
bitflags = { version = "2.10.0" }
bs58 = { version = "0.5.1" }
bytes = { version = "1.11", features = ["serde"] }
bytes-utils = "0.1.4"
bytesize = { version = "2.3.1" }
bytestring = { version = "1.5", features = ["serde"] }
ciborium = { version = "0.2.2" }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
comfy-table = { version = "7.2.1" }
chrono-humanize = { version = "0.2.3" }
clap = { version = "4", default-features = false }
clap-verbosity-flag = { version = "3.0.4" }
clap_complete = { version = "4.5" }
cling = { version = "0.1.3", default-features = false, features = ["derive"] }
const_format = "0.2.35"
criterion = "0.5"
crossterm = { version = "0.29.0" }
dashmap = { version = "6" }
datafusion = { version = "51.0.0", default-features = false, features = [
    "crypto_expressions",
    "encoding_expressions",
    "nested_expressions",
    "regex_expressions",
    "unicode_expressions",
    "recursive_protection",
] }
datafusion-functions-json = { version = "0.51.1" }
datafusion-proto = { version = "51.0.0", default-features = false }
derive_builder = "0.20.2"
derive_more = { version = "2.1.1", features = ["full"] }
dialoguer = { version = "0.12.0" }
downcast-rs = { version = "2.0.2" }
enum-map = { version = "2.7.3" }
enumset = { version = "1.1.10" }
etcd-client = { version = "0.17" }
flexbuffers = { version = "25.12.19" }
futures = "0.3.31"
futures-sink = "0.3.31"
futures-util = "0.3.31"
gardal = { version = "0.0.1-alpha.9" }
googletest = { version = "0.10", features = ["anyhow"] }
hostname = { version = "0.4.2" }
http = "1.4.0"
http-body = "1.0.1"
http-body-util = "0.1.3"
http-serde = { version = "2.1.1" }
humantime = "2.3.0"
hyper = { version = "1.8.1", default-features = false }
hyper-rustls = { version = "0.27.7", default-features = false, features = [
    "http1",
    "http2",
    "ring",
    "native-tokio",
    "tls12",
    "logging",
] }
hyper-util = { version = "0.1" }
indexmap = "2.12"
itertools = "0.14.0"
jiff = "0.2.17"
jsonptr = "0.7.1"
jsonschema = { version = "0.38.1", default-features = false }
jsonwebtoken = { version = "10.2.0", features = ["aws_lc_rs"] }
metrics = { version = "0.24" }
metrics-exporter-prometheus = { version = "0.18.1", default-features = false, features = [
    "async-runtime",
] }
metrics-util = { version = "0.20.1" }
moka = "0.12.12"
mockall = { version = "0.14.0" }
num-traits = { version = "0.2.19" }
object_store = { version = "0.13.0", features = ["aws", "azure", "gcp"] }
octocrab = { version = "0.44.1" }
opentelemetry = { version = "0.31" }
opentelemetry-contrib = { version = "0.23" }
opentelemetry-otlp = { version = "0.31" }
opentelemetry-semantic-conventions = { version = "0.31" }
opentelemetry_sdk = { version = "0.31" }
parking_lot = { version = "0.12" }
paste = "1.0"
pin-project = "1.1"
pin-project-lite = { version = "0.2" }
prost = { version = "0.14.1" }
prost-build = { version = "0.14.1" }
priority-queue = { version = "2.7.0" }
proc-macro2 = "1.0"
prost-dto = { version = "0.0.4" }
prost-types = { version = "0.14.1" }
quote = "1"
rand = "0.9.2"
regex = { version = "1.12" }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
rlimit = { version = "0.10.2" }
rocksdb = { version = "0.45.0", package = "rust-rocksdb", features = [
    "multi-threaded-cf",
    "jemalloc",
], git = "https://github.com/restatedev/rust-rocksdb", rev = "baaa733a94e2b590e20761a4de371cb367eeda51" }
rstest = "0.26.1"
rustls = { version = "0.23.35", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8.1"
webpki-roots = "1.0.6"
schemars = { version = "1.2", features = ["bytes1"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.16"
sha2 = "0.10.9"
smartstring = { version = "1.0.1" }
static_assertions = { version = "1.1.0" }
strum = { version = "0.27.2", features = ["derive"] }
smallvec = { version = "1.15.1", features = ["serde", "union"] }
syn = "2.0"
tempfile = "3.24.0"
test-log = { version = "0.2.19", default-features = false, features = [
    "trace",
] }
tikv-jemallocator = { version = "0.6", features = [
    "unprefixed_malloc_on_supported_platforms",
    "profiling",
] }
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }
tikv-jemalloc-sys = { version = "0.6", features = ["profiling"] }
thiserror = "2.0"
tokio = { version = "=1.48.0", default-features = false, features = [
    "rt-multi-thread",
    "signal",
    "macros",
    "parking_lot",
    "tracing",
] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.17" }
toml = { version = "0.9" }
tonic = { version = "0.14.2", default-features = false }
tonic-reflection = { version = "0.14.2" }
tonic-prost = "0.14.2"
tonic-prost-build = { version = "0.14.2" }
tower = "0.5.2"
tower-http = { version = "0.6.8", default-features = false }
tracing = { version = "0.1" }
tracing-opentelemetry = { version = "0.32.0" }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "parking_lot",
] }
tracing-test = { version = "0.2.5" }
typed-builder = "0.23.2"
typify = { version = "0.5.0" }
ulid = { version = "1.2.1" }
url = { version = "2.5" }
urlencoding = { version = "2.1" }
utoipa = { version = "5.4" }
utoipa-axum = "0.2"
uuid = { version = "1.19.0", features = ["v7", "serde"] }
vergen = { version = "8.0.0", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13" }

[patch.crates-io.restate-workspace-hack]
path = "workspace-hack"

[workspace.lints.rust]
unused_assignments = "allow"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
http = "1.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
toml = "0.9"

restate-admin-rest-model = { workspace = true }
restate-serde-util = { workspace = true }
restate-standalone = { path = "standalone" }
