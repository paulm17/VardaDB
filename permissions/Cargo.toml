[package]
name = "permissions"
version = "0.1.0"
edition = "2021"

[dependencies]
rhai = "1.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fjall = { version = "3.0.1", features = ["bytes_1", "lz4"] }
uuid = { version = "1.20.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
base64 = "0.22.1"
regex = "1.12.2"
lru = "0.16.3"
async-graphql = { version = "7.0" }
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"
