[package]
name = "vardadb"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"

# GraphQL
async-graphql = { version = "7.0" } 
async-graphql-parser = "7.0"
async-graphql-value = "7.0"
# NOTE: dynamic schema support might be in the core or a different feature. 
# Grafbase uses "async-graphql-value" and custom resolution.
# We will verify feature availability.

# Storage (Fjall)
fjall = "2.0" 

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitflags = "2.4"
petgraph = "0.6"
byteorder = "1.5.0"
indexmap = "2.0"
async-stream = "0.3.6"
futures-util = "0.3.31"
regex = "1.12.2"
rayon = "1.11.0"
rust-stemmers = "1.2.0"
clap = { version = "4.5.54", features = ["derive"] }
chrono = "0.4.43"
sha2 = "0.10.9"
geo = "0.32.0"
geo-types = "0.7.18"
hex = "0.4.3"

# Server
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
async-graphql-axum = "7.0"
lru = "0.16.3"
uuid = { version = "1.20.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
url = "2.5.8"

[dev-dependencies]
reqwest = { version = "0.13.1", features = ["json"] }
tempfile = "3.24.0"
