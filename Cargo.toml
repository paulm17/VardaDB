[package]
name = "vardadb"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "management", "runtime",
    "test_framework",
    "auth", "permissions",
]

[features]
# Add any root features here
auth-email = ["auth/auth-email"]

[dependencies]
# Async Runtime
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"

# GraphQL
async-graphql = { version = "7.0" } 
async-graphql-parser = "7.0"
async-graphql-value = "7.0"
async-trait = "0.1"
# NOTE: dynamic schema support might be in the core or a different feature. 
# Grafbase uses "async-graphql-value" and custom resolution.
# We will verify feature availability.

# Storage (SQLite)
rusqlite = { version = "0.31", features = ["bundled", "load_extension"] }
sqlite-vec = "0.1"

management = { path = "management" }

# Auth
auth = { path = "auth" }

# Distribution (Zenoh)
zenoh = { version = "1.7.2", features = ["unstable"] }
# Using 1.7.2 as verified in the repo source. Unstable features enabled for advanced APIs.if needed 

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitflags = "2.4"
petgraph = "0.6"
byteorder = "1.5.0"
indexmap = "2.0"
async-stream = "0.3.6"
futures-util = "0.3.31"
regex = "1.12.2"
rayon = "1.11.0"
rust-stemmers = "1.2.0"
metrics = "0.24"
sysinfo = "0.33"
humantime = "2.1"
parking_lot = "0.12"
clap = { version = "4.5.54", features = ["derive"] }
chrono = "0.4.43"
sha2 = "0.10.9"
geo = "0.32.0"
geo-types = "0.7.18"
hex = "0.4.3"

# Server
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
async-graphql-axum = "7.0"
lru = "0.16.3"
uuid = { version = "1.20.0", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
url = "2.5.8"
toml = "0.9.11"
rand = "0.8.5"
bincode = "1.3"
prism-mcp-rs = { version = "0.1", features = ["stdio"] }

# System
comfy-table = "7.1"
reqwest = { version = "0.13.1", features = ["json", "stream"] }
dashmap = "6.1.0"
rustyline = "17.0.2"
tempfile = "3.24.0"
libc = "0.2.182"
axum-extra = { version = "0.12.5", features = ["typed-header", "cookie"] }
crypto-hash = "0.3.4"
md5 = "0.8.0"
sha1 = "0.10.6"
opendal = { version = "0.55.0", features = ["services-s3"] }
base64 = "0.22.1"
blake3 = "1.8.3"
tokio-util = "0.7.18"
bytes = "1.11.1"
permissions = { version = "0.1.0", path = "permissions" }
mlx-lm = { version = "0.1.0", path = "../mlx-rs/crates/mlx-lm" }
mlx-core = { path = "../mlx-rs/crates/mlx-core" }

[dev-dependencies]

criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "million_todos"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
