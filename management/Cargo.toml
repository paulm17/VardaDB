[package]
name = "management"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
rust-embed = "8.5"
mime_guess = "2.0"
tracing = "0.1"
# For schema validation if needed, or just pass strings
