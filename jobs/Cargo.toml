[package]
name = "jobs"
version = "0.1.0"
edition = "2021"

[dependencies]
fjall = { version = "3.0.1", features = ["bytes_1", "lz4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
cron = "0.12"
chrono = "0.4"

# We might need other deps from main crate if we used them?
# uuid, byteorder were in backend.rs but check imports in vardajobs modules.
# storage.rs used std::sync::Arc, fjall::Keyspace.
# queue.rs used std::time, std::sync.
# types.rs used serde.

[dev-dependencies]
tempfile = "3.24"
