type Book {
  uid: ID!
  id: ID!
  code: String
  nameEn: String
  nameHe: String
  nameGr: String
  chapters: Int
  bookTranslations: [BookTranslation]
  bookCategories: [BookCategory]
  summaries: [Summaries]
}

type BookCategory {
  uid: ID!
  id: ID!
  book: Book
  category: Category
}

input BookCategoryFilter {
  and: [BookCategoryFilter]
  or: [BookCategoryFilter]
  not: BookCategoryFilter
}

input BookCategoryInput {
  uid: ID
  book: BookInput
  category: CategoryInput
}

input BookCategorySort {
  id: SortDirection
}

input BookFilter {
  code: StringFilter
  nameEn: StringFilter
  nameHe: StringFilter
  nameGr: StringFilter
  chapters: IntFilter
  and: [BookFilter]
  or: [BookFilter]
  not: BookFilter
}

input BookInput {
  uid: ID
  code: String
  nameEn: String
  nameHe: String
  nameGr: String
  chapters: Int
  bookTranslations: [BookTranslationInput]
  bookCategories: [BookCategoryInput]
  summaries: [SummariesInput]
}

input BookSort {
  code: SortDirection
  nameEn: SortDirection
  nameHe: SortDirection
  nameGr: SortDirection
  chapters: SortDirection
}

type BookTranslation {
  uid: ID!
  id: ID!
  book: Book
  translation: Translations
  chapters(sort: ChapterSort): [Chapter]
}

input BookTranslationFilter {
  and: [BookTranslationFilter]
  or: [BookTranslationFilter]
  not: BookTranslationFilter
}

input BookTranslationInput {
  uid: ID
  book: BookInput
  translation: TranslationsInput
  chapters: [ChapterInput]
}

input BookTranslationSort {
  id: SortDirection
}

input BooleanFilter {
  eq: Boolean
}

type Category {
  uid: ID!
  id: ID!
  name: String
  bookCategories: [BookCategory]
}

input CategoryFilter {
  name: StringFilter
  and: [CategoryFilter]
  or: [CategoryFilter]
  not: CategoryFilter
}

input CategoryInput {
  uid: ID
  name: String
  bookCategories: [BookCategoryInput]
}

input CategorySort {
  name: SortDirection
}

type Chapter {
  uid: ID!
  id: ID!
  number: Int
  bookTranslation: BookTranslation
  verses(filter: VerseFilter): [Verse]
  summaries: [Summaries]
}

input ChapterFilter {
  number: IntFilter
  and: [ChapterFilter]
  or: [ChapterFilter]
  not: ChapterFilter
}

input ChapterInput {
  uid: ID
  number: Int
  bookTranslation: BookTranslationInput
  verses: [VerseInput]
  summaries: [SummariesInput]
}

input ChapterSort {
  number: SortDirection
}

scalar DateTime

input DateTimeFilter {
  eq: DateTime
  gt: DateTime
  lt: DateTime
  ge: DateTime
  le: DateTime
  in: [DateTime]
}

type Entities {
  uid: ID!
  entityId: Int
  name: String
  entityType: String
  description: String
  mentions: [EntityMentions]
  edgesA: [EntityEdges]
  edgesB: [EntityEdges]
}

input EntitiesFilter {
  entityId: IntFilter
  name: StringFilter
  entityType: StringFilter
  description: StringFilter
  and: [EntitiesFilter]
  or: [EntitiesFilter]
  not: EntitiesFilter
}

input EntitiesInput {
  uid: ID
  entityId: Int
  name: String
  entityType: String
  description: String
  mentions: [EntityMentionsInput]
  edgesA: [EntityEdgesInput]
  edgesB: [EntityEdgesInput]
}

input EntitiesSort {
  entityId: SortDirection
  name: SortDirection
  entityType: SortDirection
  description: SortDirection
}

type EntityEdges {
  uid: ID!
  edgeId: Int
  relationType: String
  weight: Float
  entityA: Entities
  entityB: Entities
}

input EntityEdgesFilter {
  edgeId: IntFilter
  relationType: StringFilter
  weight: FloatFilter
  and: [EntityEdgesFilter]
  or: [EntityEdgesFilter]
  not: EntityEdgesFilter
}

input EntityEdgesInput {
  uid: ID
  edgeId: Int
  relationType: String
  weight: Float
  entityA: EntitiesInput
  entityB: EntitiesInput
}

input EntityEdgesSort {
  edgeId: SortDirection
  relationType: SortDirection
  weight: SortDirection
}

type EntityMentions {
  uid: ID!
  mentionId: Int
  tokenStart: Int
  tokenEnd: Int
  confidence: Float
  entity: Entities
  verse: Verse
}

input EntityMentionsFilter {
  mentionId: IntFilter
  tokenStart: IntFilter
  tokenEnd: IntFilter
  confidence: FloatFilter
  and: [EntityMentionsFilter]
  or: [EntityMentionsFilter]
  not: EntityMentionsFilter
}

input EntityMentionsInput {
  uid: ID
  mentionId: Int
  tokenStart: Int
  tokenEnd: Int
  confidence: Float
  entity: EntitiesInput
  verse: VerseInput
}

input EntityMentionsSort {
  mentionId: SortDirection
  tokenStart: SortDirection
  tokenEnd: SortDirection
  confidence: SortDirection
}

input FloatFilter {
  eq: Float
  gt: Float
  lt: Float
  ge: Float
  le: Float
  between: [Float]
  in: [Float]
}

type InterlinearAlignments {
  uid: ID!
  id: ID!
  lemmaA: Lemmas
  lemmaB: Lemmas
}

input InterlinearAlignmentsFilter {
  and: [InterlinearAlignmentsFilter]
  or: [InterlinearAlignmentsFilter]
  not: InterlinearAlignmentsFilter
}

input InterlinearAlignmentsInput {
  uid: ID
  lemmaA: LemmasInput
  lemmaB: LemmasInput
}

input InterlinearAlignmentsSort {
  id: SortDirection
}

input IntFilter {
  eq: Int
  gt: Int
  lt: Int
  ge: Int
  le: Int
  between: [Int]
  in: [Int]
}

scalar JSON

