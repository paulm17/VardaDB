type MutationEvent {
  type: String!
  uid: ID!
  mutation: MutationType!
  payload: JSON
}

enum MutationType {
  CREATE
  UPDATE
  DELETE
}

type Query {
  queryLanguage(filter: LanguageFilter, sort: LanguageSort, first: Int, after: String): [Language]
  getLanguage(uid: ID, code: String): Language
  queryCategory(filter: CategoryFilter, sort: CategorySort, first: Int, after: String): [Category]
  getCategory(uid: ID, name: String): Category
  queryTranslations(filter: TranslationsFilter, sort: TranslationsSort, first: Int, after: String): [Translations]
  getTranslations(uid: ID, code: String): Translations
  queryBook(filter: BookFilter, sort: BookSort, first: Int, after: String): [Book]
  getBook(uid: ID, code: String): Book
  queryBookTranslation(filter: BookTranslationFilter, sort: BookTranslationSort, first: Int, after: String): [BookTranslation]
  getBookTranslation(uid: ID): BookTranslation
  queryBookCategory(filter: BookCategoryFilter, sort: BookCategorySort, first: Int, after: String): [BookCategory]
  getBookCategory(uid: ID): BookCategory
  queryChapter(filter: ChapterFilter, sort: ChapterSort, first: Int, after: String): [Chapter]
  getChapter(uid: ID): Chapter
  queryVerse(filter: VerseFilter, sort: VerseSort, first: Int, after: String): [Verse]
  getVerse(uid: ID): Verse
  queryVerseContent(filter: VerseContentFilter, sort: VerseContentSort, first: Int, after: String): [VerseContent]
  getVerseContent(uid: ID): VerseContent
  queryLemmas(filter: LemmasFilter, sort: LemmasSort, first: Int, after: String): [Lemmas]
  getLemmas(uid: ID, lemmaId: String): Lemmas
  queryTokenMorphology(filter: TokenMorphologyFilter, sort: TokenMorphologySort, first: Int, after: String): [TokenMorphology]
  getTokenMorphology(uid: ID, morphId: String): TokenMorphology
  queryWordnetLinks(filter: WordnetLinksFilter, sort: WordnetLinksSort, first: Int, after: String): [WordnetLinks]
  getWordnetLinks(uid: ID): WordnetLinks
  queryVerseEmbeddings(filter: VerseEmbeddingsFilter, sort: VerseEmbeddingsSort, first: Int, after: String): [VerseEmbeddings]
  getVerseEmbeddings(uid: ID): VerseEmbeddings
  queryLexiconEmbeddings(filter: LexiconEmbeddingsFilter, sort: LexiconEmbeddingsSort, first: Int, after: String): [LexiconEmbeddings]
  getLexiconEmbeddings(uid: ID, embeddingId: String): LexiconEmbeddings
  querySummaries(filter: SummariesFilter, sort: SummariesSort, first: Int, after: String): [Summaries]
  getSummaries(uid: ID, summaryId: String): Summaries
  querySyntaxRelations(filter: SyntaxRelationsFilter, sort: SyntaxRelationsSort, first: Int, after: String): [SyntaxRelations]
  getSyntaxRelations(uid: ID, relationId: String): SyntaxRelations
  queryInterlinearAlignments(filter: InterlinearAlignmentsFilter, sort: InterlinearAlignmentsSort, first: Int, after: String): [InterlinearAlignments]
  getInterlinearAlignments(uid: ID): InterlinearAlignments
  queryEntities(filter: EntitiesFilter, sort: EntitiesSort, first: Int, after: String): [Entities]
  getEntities(uid: ID, entityId: String): Entities
  queryEntityMentions(filter: EntityMentionsFilter, sort: EntityMentionsSort, first: Int, after: String): [EntityMentions]
  getEntityMentions(uid: ID, mentionId: String): EntityMentions
  queryEntityEdges(filter: EntityEdgesFilter, sort: EntityEdgesSort, first: Int, after: String): [EntityEdges]
  getEntityEdges(uid: ID, edgeId: String): EntityEdges
  queryUnifiedBible(filter: UnifiedBibleFilter, sort: UnifiedBibleSort, first: Int, after: String): [UnifiedBible]
  getUnifiedBible(uid: ID): UnifiedBible
  queryVideo(filter: VideoFilter, sort: VideoSort, first: Int, after: String): [Video]
  getVideo(uid: ID): Video
  queryVideoView(filter: VideoViewFilter, sort: VideoViewSort, first: Int, after: String): [VideoView]
  getVideoView(uid: ID): VideoView
  queryKeyword(filter: KeywordFilter, sort: KeywordSort, first: Int, after: String): [Keyword]
  getKeyword(uid: ID, text: String): Keyword
  queryVideoKeyword(filter: VideoKeywordFilter, sort: VideoKeywordSort, first: Int, after: String): [VideoKeyword]
  getVideoKeyword(uid: ID): VideoKeyword
  search(vector: [Float!], k: Int): [SearchResult!]
  hybridSearch(vector: [Float!], text: String!, field: String!, k: Int): [SearchResult!]
}

type SearchResult {
  uid: ID!
  distance: Float!
}

enum SortDirection {
  ASC
  DESC
}

input StringFilter {
  eq: String
  contains: String
  allofterms: String
  anyofterms: String
  alloftext: String
  anyoftext: String
  lt: String
  le: String
  gt: String
  ge: String
