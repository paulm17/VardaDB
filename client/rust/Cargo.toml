[package]
name = "varda-client-rs"
version = "0.1.0"
edition = "2021"
description = "A type-safe Rust client for VardaDB"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
