[package]
name = "varda-test-framework"
version = "0.1.0"
edition = "2021"
description = "Comprehensive testing framework for VardaDB"

[[bin]]
name = "varda_test"
path = "src/main.rs"

[dependencies]
# VardaDB (the crate we're testing)
vardadb = { path = ".." }

# Async Runtime
tokio = { version = "1.36", features = ["full", "rt-multi-thread"] }

# GraphQL
async-graphql = "7.0"
async-graphql-value = "7.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Testing utilities
tempfile = "3.24"
proptest = "1.4"

# Random number generation (deterministic)
rand = "0.8"
rand_chacha = "0.3"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Timing and benchmarks
criterion = { version = "0.5", features = ["async_tokio"] }

# Output formatting
colored = "2.1"

# Tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = "0.4"

# Async utilities
futures = "0.3"

# HTTP client for multi-node testing
reqwest = { version = "0.12", features = ["json"] }
